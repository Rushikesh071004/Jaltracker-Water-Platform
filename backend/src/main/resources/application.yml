server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: jaltracker-water-platform
  cache:
    type: ${SPRING_CACHE_TYPE:simple}
  jackson:
    serialization:
      fail-on-empty-beans: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:waterbill}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASS:root}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
      org:
        hibernate:
          envers:
            audit_table_suffix: _aud
            revision_field_name: rev
            revision_type_field_name: revtype
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  data:
    redis:
      repositories:
        enabled: false
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 5
        auto-startup: false
  mail:
    host: ${MAIL_HOST:smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
    metrics:
      enabled: true
  health:
    redis:
      enabled: ${ACTUATOR_REDIS_HEALTH:false}
    rabbit:
      enabled: ${ACTUATOR_RABBIT_HEALTH:false}
    mail:
      enabled: false
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

# Application specific configurations & secrets
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_JalTrackerDemoKey}
    key-secret: ${RAZORPAY_KEY_SECRET:dummy_razorpay_secret_key_12345}
  rate-limiting:
    capacity: 5
    refill-tokens: 5
    duration-minutes: 1
  alerts:
    leak-sigma-threshold: 2.0
    min-historical-days: 7
    scheduled-cron: "0 0 2 * * ?" # Daily at 2:00 AM
  billing:
    due-days-offset: 15
  mail:
    simulation-mode: true # Logs email contents to console when mail server is offline

# Twilio WhatsApp & SMS 2FA Settings
twilio:
  account:
    sid: ${TWILIO_ACCOUNT_SID:AC_dummy_account_sid_12345}
  auth:
    token: ${TWILIO_AUTH_TOKEN:dummy_auth_token_12345}
  phoneNumber: ${TWILIO_PHONE_NUMBER:+14155238886}
  service:
    id: ${TWILIO_SERVICE_ID:}
  simulation-mode: ${TWILIO_SIMULATION_MODE:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{transactionId}] [%X{clientIp}] %-5level %logger{36} - %msg%n"
  level:
    com.waterbill: DEBUG
    org.springframework.security: INFO
    org.springframework.web: INFO
